<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- SEO Meta Tags -->
  <title>{% if page.title %}{{ page.title }} - Maddyzone Tech Blog{% else %}Maddyzone: JavaScript, Angular & Web Development Blog{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | default: 'Expert insights on JavaScript, Angular, and modern web development. Learn from practical tutorials and industry best practices.' }}{% endif %}">
  <meta name="author" content="Rituraj Ratan">
  <meta name="robots" content="index, follow, max-snippet:-1, max-video-preview:-1, max-image-preview:large">
  <meta name="googlebot" content="index, follow">
  <meta name="language" content="en-US">
  <meta name="theme-color" content="#4285f4">
  
  <!-- Keywords and Categories -->
  {% if page.tags %}
  <meta name="keywords" content="{{ page.tags | join: ', ' }}, JavaScript, Angular, Web Development, Programming, Tech Blog">
  {% elsif page.categories %}
  <meta name="keywords" content="{{ page.categories | join: ', ' }}, JavaScript, Angular, Web Development, Programming, Tech Blog">
  {% else %}
  <meta name="keywords" content="JavaScript, Angular, Web Development, Programming, Tech Blog, Tutorials, Software Engineering">
  {% endif %}
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/modern-enhanced.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/force-modern.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/css/seo-enhancements.css" | prepend: site.baseurl }}">
  
  <!-- Modern Theme Script -->
  <script>
    // Apply stored theme or system preference immediately
    (function() {
      const storedTheme = localStorage.getItem('theme');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = storedTheme || systemTheme;
      document.documentElement.setAttribute('data-theme', theme);
    })();
    
    // Restore visibility after theme is set
    document.addEventListener('DOMContentLoaded', function() {
      document.documentElement.style.visibility = 'visible';
    });
  </script>
  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Maddyzone Tech Blog">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  
  {% if page.title %}
  <!-- Article/Post Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{% if page.image %}{{ site.url }}{{ site.baseurl }}/img/{{ page.image }}{% else %}{{ site.url }}{{ site.baseurl }}/img/maddyzone-og.png{% endif %}">
  <meta property="og:image:alt" content="{% if page.image_alt %}{{ page.image_alt }}{% else %}{{ page.title }}{% endif %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="article:author" content="https://www.facebook.com/rituraj.ratan.5">
  <meta property="article:publisher" content="https://www.facebook.com/maddyzonenews">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {% if page.last_modified_at %}<meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">{% endif %}
  {% if page.categories %}<meta property="article:section" content="{{ page.categories.first }}">{% endif %}
  {% for tag in page.tags %}<meta property="article:tag" content="{{ tag }}">{% endfor %}
  {% else %}
  <!-- Website Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Maddyzone: JavaScript, Angular & Web Development Blog">
  <meta property="og:description" content="{{ site.description | default: 'Expert insights on JavaScript, Angular, and modern web development. Learn from practical tutorials and industry best practices.' }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/img/maddyzone-og.png">
  <meta property="og:image:alt" content="Maddyzone Tech Blog - JavaScript and Angular Tutorials">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {% endif %}

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@maddyzonenews">
  <meta name="twitter:creator" content="@maddyzonenews">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}Maddyzone: JavaScript, Angular & Web Development Blog{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description | default: 'Expert insights on JavaScript, Angular, and modern web development.' }}{% endif %}">
  <meta name="twitter:image" content="{% if page.image %}{{ site.url }}{{ site.baseurl }}/img/{{ page.image }}{% else %}{{ site.url }}{{ site.baseurl }}/img/maddyzone-twitter.png{% endif %}">
  <meta name="twitter:image:alt" content="{% if page.image_alt %}{{ page.image_alt }}{% else %}Maddyzone Tech Blog{% endif %}">
  
  <!-- Additional SEO Meta Tags -->
  <meta name="application-name" content="Maddyzone Tech Blog">
  <meta name="msapplication-TileColor" content="#4285f4">
  <meta name="msapplication-config" content="{{ site.baseurl }}/browserconfig.xml">
  
  <!-- Load theme script at end of head for immediate execution -->
  <script src="{{ "/js/theme-enhanced.js" | prepend: site.baseurl }}" defer></script>
</head>
